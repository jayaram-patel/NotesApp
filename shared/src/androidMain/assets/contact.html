<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Contact Us</title>

    <style>

        body{
            font-family: Arial;
            margin:40px;
            background:#f5f5f5;
        }

        h2{
            text-align:center;
        }

        input,textarea{

            width:100%;
            padding:10px;
            margin-top:10px;
            margin-bottom:15px;

        }

        button{

            width:100%;
            padding:12px;
            background:#1976D2;
            color:white;
            border:none;
            cursor:pointer;

        }

    </style>

</head>

<body>

<h2>Contact Us</h2>

<input
        id="name"
        placeholder="Enter Name"
/>

<input
        id="email"
        placeholder="Enter Email"
/>

<textarea
        id="message"
        rows="5"
        placeholder="Enter Message">
</textarea>

<button onclick="submitForm()">
    Submit
</button>

<script>

    function submitForm(){

        const name=document.getElementById("name").value;
        const email=document.getElementById("email").value;
        const message=document.getElementById("message").value;

        if(name==="" || email==="" || message===""){

            alert("Please fill all fields");
            return;

        }

        Android.submitForm(
            name,
            email,
            message
        );

    }

</script>

</body>

</html>
